<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="420" fill="#f8fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">CTR de ejemplo: SFC–2 000 ft, radio ≥ 5 NM, circuito derecha pista 36 a 1 000 ft</text>
  <circle cx="380" cy="225" r="170" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
  <!-- runway 36 vertical -->
  <rect x="368" y="160" width="24" height="130" rx="3" fill="#334155"/>
  <text x="372" y="285" font-size="11" fill="#fff" font-weight="bold">36</text>
  <!-- right-hand circuit for 36: east side -->
  <rect x="392" y="150" width="90" height="150" rx="25" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="488" y="230" font-size="12" fill="#1e3a8a">circuito</text>
  <text x="488" y="245" font-size="12" fill="#1e3a8a">derecha</text>
  <!-- VFR points -->
  <g font-size="14" font-weight="bold" fill="#065f46">
    <circle cx="210" cy="225" r="8" fill="#16a34a"/><text x="186" y="212">W</text>
    <circle cx="380" cy="55" r="8" fill="#16a34a"/><text x="392" y="60">N</text>
    <circle cx="380" cy="395" r="8" fill="#16a34a"/><text x="392" y="400">S</text>
    <circle cx="285" cy="225" r="7" fill="#0ea5e9"/><text x="260" y="250" fill="#075985">WA</text>
  </g>
  <path d="M130,225 L200,225" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="215" font-size="12" fill="#b45309">Llamar 2 min antes</text>
  <path d="M218,225 L276,225 M292,222 Q330,180 365,150 Q400,120 380,64" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="300" font-size="12" fill="#0f172a">Tránsito: W → WA → campo → N/S</text>
  <text x="20" y="316" font-size="12" fill="#0f172a">por encima del circuito</text>
  <text x="20" y="332" font-size="12" fill="#0f172a">(+500–1 000 ft) e info de tránsito</text>
</svg>
