<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="780" height="380" fill="#f8fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <g font-size="13">
    <rect x="20" y="150" width="170" height="60" rx="8" fill="#e2e8f0" stroke="#334155"/>
    <text x="35" y="176" font-weight="bold">¿La 2.ª es de menor</text><text x="35" y="195" font-weight="bold">categoría que la 1.ª?</text>
    <path d="M190,165 L250,90" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="200" y="115">No</text>
    <path d="M190,195 L250,260" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="203" y="245">Sí</text>
    <rect x="255" y="55" width="215" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="268" y="82" font-weight="bold" fill="#14532d">NO APLICA estela</text><text x="268" y="102" fill="#14532d">(salvo intersección: la</text><text x="268" y="118" fill="#14532d">wiki la extiende a H tras H)</text>
    <rect x="255" y="230" width="190" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="268" y="256" font-weight="bold" fill="#7f1d1d">¿La 1.ª es SUPER</text><text x="268" y="275" font-weight="bold" fill="#7f1d1d">(A380)?</text>
    <path d="M445,245 L505,200" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="465" y="215">Sí</text>
    <path d="M445,275 L505,320" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="465" y="315">No</text>
    <rect x="510" y="170" width="230" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="522" y="195" font-weight="bold">L o M: 3 min</text><text x="522" y="215">H tras Super: 2 min</text>
    <rect x="510" y="295" width="230" height="45" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="522" y="323" font-weight="bold">2 min</text>
    <rect x="490" y="40" width="275" height="95" rx="8" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="500" y="64" font-weight="bold" fill="#1e3a8a">+1 min si la 2.ª sale de una</text>
    <text x="500" y="82" font-weight="bold" fill="#1e3a8a">intersección más adelantada</text>
    <text x="500" y="102" fill="#1e3a8a">(toma y despegue = intersección;</text>
    <text x="500" y="120" fill="#1e3a8a">paralela &lt; 760 m = misma pista)</text>
  </g>
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#0f172a">Estela turbulenta en SALIDA (todas las salidas, IFR y VFR)</text>
  <text x="20" y="368" font-size="12" fill="#334155">Categorías: L ≤ 7 t · M &lt; 136 t · H ≥ 136 t · Super = A380 · B757 = H cuando va delante</text>
</svg>
